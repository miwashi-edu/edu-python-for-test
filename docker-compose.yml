services:
  server:
    build:
      context: .
      dockerfile: DockerFile_python
    container_name: python-server
    hostname: pyserv
    volumes:
      - .:/work
    ports:
      - "2222:22"
    networks:
      testnet:
        ipv4_address: 192.168.2.10
  client:
    build:
      context: .
      dockerfile: DockerFile_python
    container_name: python-client
    hostname: pycli
    volumes:
      - .:/work
    ports:
      - "2223:22"
    depends_on:
      - server
    networks:
      testnet:
        ipv4_address: 192.168.2.11
  petstore:
    image: swaggerapi/petstore3:unstable
    platform: linux/amd64
    container_name: petstore
    hostname: petstore
    ports:
      - "8080:8080"
    networks:
      testnet:
        ipv4_address: 192.168.2.12
networks:
  testnet:
    name: testnet
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.2.0/24
          gateway: 192.168.2.1
